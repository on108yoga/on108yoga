<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - ON108 YOGA</title>
    
    <!-- 구글 폰트 및 프리텐다드 불러오기 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fcfcfc;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. Header & Navigation */
        .navbar {
            justify-content: center;
            display: flex;
            text-align: center;
            align-items: center;
            gap: 15px;
            background-color: #517e73;
            padding: 10px;
            font-size: 14px;     
        }

        .navbar a {         
            text-decoration: none !important;
            color: white;
            font-weight: 500;
            letter-spacing: 0.08em;
            padding: 2px 4px;       
            transition: opacity 0.2s ease;            
        }

        .navbar a:hover {
            opacity: 0.8;
            text-decoration: none !important;
        }

        h1 {
            background-color: #f4efe6;
            color: #3f4e43;           
            text-align: center;
            letter-spacing: 0.35em;
            margin: 0;
            padding: 12px 0;
            font-family: 'Cormorant Garamond', 'Noto Sans KR', serif;
            font-weight: 300;
            font-size: 20px;
            text-transform: uppercase;
        }

        /* 2. Main Content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .forgot-container {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(63, 78, 67, 0.08);
            border: 1px solid #eae6df;
        }

        .forgot-container h2 {
            font-size: 22px;
            font-weight: 600;
            color: #3f4e43;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .forgot-desc {
            font-size: 13px;
            color: #777;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            background-color: #fafafa;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input[type="text"]:focus {
            border-color: #517e73;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(81, 126, 115, 0.15);
        }

        /* Submit Button */
        #resetBtn {
            width: 100%;
            padding: 16px;
            background-color: #3f4e43;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        #resetBtn:hover {
            background-color: #2d3830;
        }

        #resetBtn:active {
            transform: scale(0.99);
        }

        /* 하단 링크 */
        .forgot-menu {
            margin-top: 24px;
            font-size: 13px;
            color: #bbb;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .forgot-menu a {
            color: #517e73;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-menu a:hover {
            text-decoration: underline;
            color: #3f4e43;
        }

        /* 3. Footer */
        footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
            background-color: #f4efe6;
            border-top: 1px solid #eae6df;
        }
    </style>
</head>

<body>
<header>
    <nav class="navbar">
        <a href="index.html">홈</a>
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
    </nav>
    
    <h1>
        ON108 YOGA
        <span style="display: block; font-size: 11px; font-weight: 200; letter-spacing: 0.2em; margin-top: 4px; color: #777;">
            온108요가
        </span>
    </h1>
</header>

<main>
    <section class="forgot-container">
        <h2>비밀번호 재설정</h2>
        <p class="forgot-desc">가입 시 등록한 성함과 전화번호를 입력하시면<br>비밀번호 재설정 안내를 도와드립니다.</p>
        
        <form id="forgotForm">
            <div class="form-group">
                <label for="userName">이름</label>
                <input
                    type="text"
                    id="userName"
                    placeholder="이름을 입력하세요"
                    required>
            </div>

            <div class="form-group">
                <label for="phone">전화번호</label>
                <input
                    type="text"
                    id="phone"
                    placeholder="01012345678 ('-' 없이 입력)"
                    required>
            </div>

            <button type="submit" id="resetBtn">
                비밀번호 재설정 요청
            </button>
        </form>

        <div class="forgot-menu">
            <a href="login.html">로그인으로 돌아가기</a>
            <span>|</span>
            <a href="signup.html">회원가입</a>
        </div>
    </section>
</main>

<footer>
    <p>© ON108YOGA Reservation System</p>
</footer>

<script type="module" src="firebase.js"></script>
<script type="module" src="auth.js"></script>

</body>
</html>
