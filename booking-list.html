<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 수업별 예약 현황</title>
    <style>    
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Sans+KR:wght@200;300;400;500;700&display=swap');
        
        /* ─── [1] 공통 기본 및 리셋 ─── */
        * { 
            padding: 0; 
            margin: 0; 
            box-sizing: border-box; 
        }   
        
        html {
            scroll-behavior: smooth;
        }

        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: #f9fafb; 
            color: #333;
        }

        /* ─── [2] 상단 메뉴 및 헤더 ─── */
        .menu {
            justify-content: center;
            display: flex;
            text-align: center;
            align-items: center;
            gap: 15px;
            background-color: #517e73;
            padding: 10px;
            font-size: 14px;
            flex-wrap: wrap;
        }
        
        .menu a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 4px 8px;
            transition: opacity 0.2s;
        }        
        
        .menu a:hover {
            color: #f2cc8f;
        }
        
        nav {
            width: 100%;
            justify-content: center;
            text-align: center;
            background-color: #517e73;       
        }
        
        h1 {
            background-color: #f4efe6;
            color: #3f4e43;
            text-align: center;
            letter-spacing: 0.35em;
            margin: 0;
            padding: 12px 0;
            font-family: 'Cormorant Garamond', 'Noto Sans KR', serif;
            font-weight: 300;
            font-size: 20px;
            text-transform: uppercase;
        }     

        header { 
            width: 100%; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
        }

        /* ─── [3] 본인 레이아웃 및 대시보드 ─── */
        .admin-container { 
            max-width: 950px; 
            margin: 0 auto 40px auto; 
            background: #fff; 
            padding: 28px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #3f4e43;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 최신 수강신청 표 스타일 */
        .recent-table-box {
            margin-bottom: 10px;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            -webkit-overflow-scrolling: touch;
        }

        .recent-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
            min-width: 600px;
        }

        .recent-table th {
            background-color: #f4efe6;
            color: #3f4e43;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid #e2d9cc;
            white-space: nowrap;
        }

        .recent-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #f3f4f6;
            color: #4b5563;
            white-space: nowrap;
        }

        .recent-table tr:hover {
            background-color: #faf9f6;
        }

        .recent-table tr.cancelled-row {
            background-color: #fef2f2;
            opacity: 0.85;
        }

        .recent-table tr:last-child td {
            border-bottom: none;
        }

        /* 최근 수강신청 전용 페이지네이션 박스 */
        #recentPagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        /* 상태 태그 */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-approved {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .badge-cancelled {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fca5a5;
        }

        .btn-delete-res {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #ef4444;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete-res:hover {
            background: #ef4444;
            color: #ffffff;
        }

        .btn-disabled {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #9ca3af;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: not-allowed;
        }

        /* 구분선 */
        .divider {
            height: 1px;
            background-color: #eee;
            margin: 30px 0;
        }

        /* 날짜 조회 박스 */
        .date-picker-box { 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            background: #fafaeb;
            padding: 14px 18px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .date-picker-box input[type="date"] {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }

        .btn-search {
            padding: 7px 16px; 
            background: #517e73; 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-search:hover {
            background: #3f4e43;
        }

        /* 수업 타임 카드 */
        .time-slot-card { 
            border: 1px solid #e5e7eb; 
            border-radius: 8px; 
            margin-bottom: 16px; 
            overflow: hidden; 
        }

        .slot-header { 
            background: #517e73; 
            color: white; 
            padding: 12px 16px; 
            font-weight: 500; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .member-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
        }

        .member-item { 
            padding: 12px 16px; 
            border-bottom: 1px solid #f3f4f6; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .member-item:last-child { 
            border-bottom: none; 
        }

        .empty-msg { 
            padding: 24px; 
            color: #9ca3af; 
            text-align: center; 
            font-size: 14px;
        }

        /* ─── [4] 푸터 ─── */
        footer {
            width: 100%;
            margin-top: 40px;
            padding: 20px;
            background-color: #f4efe6;
            font-size: 12px;
            color: #777;
            text-align: center;
        }

        /* ─── [5] 모바일 반응형 미디어 쿼리 ─── */
        @media (max-width: 768px) {
            header {
                margin-bottom: 15px;
            }

            .menu {
                gap: 10px;
                padding: 8px 12px;
                font-size: 13px;
            }

            h1 {
                font-size: 16px;
                letter-spacing: 0.25em;
                padding: 10px 0;
            }

            .admin-container {
                margin: 0 10px 20px 10px;
                padding: 16px;
                border-radius: 8px;
            }

            .section-title {
                font-size: 16px;
            }

            .date-picker-box {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 12px;
            }

            .date-picker-box input[type="date"] {
                width: 100%;
                padding: 8px;
            }

            .btn-search {
                width: 100%;
                padding: 10px;
                font-size: 14px;
            }

            .slot-header {
                padding: 10px 12px;
                font-size: 14px;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .member-item {
                padding: 10px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

        <nav class="menu">

            <a href="members.html">회원관리</a>  
            <a href="reservation.html">예약</a>
            <a href="mypage.html">마이페이지</a>
            <span id="userInfo"></span>
        </nav>
        <h1>
            ON108 YOGA
            <span style="display: block; font-size: 11px; font-weight: 200; letter-spacing: 0.2em; margin-top: 4px; color: #777;">
                온108요가
            </span>
        </h1>
    </header>
    
    <div class="admin-container">
        
        <!-- SECTION 1: 새롭게 신청된 최신 수강신청 표 (
