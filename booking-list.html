<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 수업별 예약 현황</title>
    <style>    
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Sans+KR:wght@200;300;400;500;700&display=swap');
        
        /* ─── [1] 공통 기본 및 리셋 ─── */
        * { 
            padding: 0; 
            margin: 0; 
            box-sizing: border-box; 
        }   
        
        html {
            scroll-behavior: smooth;
        }

        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: #f9fafb; 
            color: #333;
        }

        /* ─── [2] 상단 메뉴 및 헤더 ─── */
        .menu {
            justify-content: center;
            display: flex;
            text-align: center;
            align-items: center;
            gap: 15px;
            background-color: #517e73;
            padding: 10px;
            font-size: 14px;
            flex-wrap: wrap;
        }
        
        .menu a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 4px 8px;
            transition: opacity 0.2s;
        }        
        
        .menu a:hover {
            color: #f2cc8f;
        }
        
        nav {
            width: 100%;
            justify-content: center;
            text-align: center;
            background-color: #517e73;       
        }
        
        h1 {
            background-color: #f4efe6;
            color: #3f4e43;
            text-align: center;
            letter-spacing: 0.35em;
            margin: 0;
            padding: 12px 0;
            font-family: 'Cormorant Garamond', 'Noto Sans KR', serif;
            font-weight: 300;
            font-size: 20px;
            text-transform: uppercase;
        }     

        header { 
            width: 100%; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
        }

        /* ─── [3] 본인 레이아웃 및 대시보드 ─── */
        .admin-container { 
            max-width: 950px; 
            margin: 0 auto 40px auto; 
            background: #fff; 
            padding: 28px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #3f4e43;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 최신 수강신청 표 스타일 */
        .recent-table-box {
            margin-bottom: 10px;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            -webkit-overflow-scrolling: touch;
        }

        .recent-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
            min-width: 600px;
        }

        .recent-table th {
            background-color: #f4efe6;
            color: #3f4e43;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid #e2d9cc;
            white-space: nowrap;
        }

        .recent-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #f3f4f6;
            color: #4b5563;
            white-space: nowrap;
        }

        .recent-table tr:hover {
            background-color: #faf9f6;
        }

        .recent-table tr.cancelled-row {
            background-color: #fef2f2;
        }

        .recent-table tr:last-child td {
            border-bottom: none;
        }

        /* 최근 수강신청 전용 페이지네이션 박스 */
        #recentPagination {
            display: flex;
