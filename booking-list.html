<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 수업별 예약 현황</title>
    <style>    
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Sans+KR:wght@200;300;400;500;700&display=swap');
        
        /* ─── [1] 공통 기본 및 리셋 ─── */
        * { 
            padding: 0; 
            margin: 0; 
            box-sizing: border-box; 
        }   
        
        html {
            scroll-behavior: smooth;
        }

        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background: #f9fafb; 
            color: #333;
        }

        /* ─── [2] 상단 메뉴 및 헤더 ─── */
        .menu {
            justify-content: center;
            display: flex;
            text-align: center;
            align-items: center;
            gap: 15px;
            background-color: #517e73;
            padding: 10px;
            font-size: 14px;
        }
        
        .menu a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }        
        
        .menu a:hover {
            color: #f2cc8f;
        }
        
        nav {
            width: 100%;
            justify-content: center;
            text-align: center;
            background-color: #517e73;       
        }
        
        h1 {
            background-color: #f4efe6; /* 따뜻하고 세련된 샌드 베이지 */
            color: #3f4e43;            /* 딥 그린 폰트 컬러 */
            text-align: center;
            letter-spacing: 0.35em;
            margin: 0;
            padding: 12px 0;           /* 높이 축소 */
            font-family: 'Cormorant Garamond', 'Noto Sans KR', serif;
            font-weight: 300;
            font-size: 20px;
            text-transform: uppercase;
        }     

        header { 
            width: 100%; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
        }

        /* ─── [3] 본인 레이아웃 및 대시보드 ─── */
        .admin-container { 
            max-width: 950px; 
            margin: 0 auto 40px auto; 
            background: #fff; 
            padding: 28px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #3f4e43;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 최신 수강신청 표 스타일 */
        .recent-table-box {
            margin-bottom: 35px;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .recent-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        .recent-table th {
            background-color: #f4efe6;
            color: #3f4e43;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid #e2d9cc;
            white-space: nowrap;
        }

        .recent-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #f3f4f6;
            color: #4b5563;
            white-space: nowrap;
        }

        .recent-table tr:hover {
            background-color: #faf9f6;
        }

        .recent-table tr:last-child td {
            border-bottom: none;
        }

        /* 상태 태그 */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-pending {
            background-color: #fff3ed;
            color: #e65100;
            border: 1px solid #ffe0b2;
        }
        .badge-approved {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        /* 구분선 */
        .divider {
            height: 1px;
            background-color: #eee;
            margin: 30px 0;
        }

        /* 날짜 조회 박스 */
        .date-picker-box { 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            background: #fafaeb;
            padding: 14px 18px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .date-picker-box input[type="date"] {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }

        .btn-search {
            padding: 7px 16px; 
            background: #517e73; 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-search:hover {
            background: #3f4e43;
        }

        /* 수업 타임 카드 */
        .time-slot-card { 
            border: 1px solid #e5e7eb; 
            border-radius: 8px; 
            margin-bottom: 16px; 
            overflow: hidden; 
        }

        .slot-header { 
            background: #517e73; 
            color: white; 
            padding: 12px 16px; 
            font-weight: 500; 
            display: flex; 
            justify-content: space-between; 
        }

        .member-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
        }

        .member-item { 
            padding: 12px 16px; 
            border-bottom: 1px solid #f3f4f6; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .member-item:last-child { 
            border-bottom: none; 
        }

        .empty-msg { 
            padding: 24px; 
            color: #9ca3af; 
            text-align: center; 
            font-size: 14px;
        }

        /* ─── [4] 푸터 ─── */
        footer {
            width: 100%;
            margin-top: 40px;
            padding: 20px;
            background-color: #f4efe6;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <nav class="menu">
            <a href="index.html">홈</a>
            <a href="members.html">회원관리</a>  
            <a href="reservation.html">예약</a>
            <a href="mypage.html">마이페이지</a>
            <span id="userInfo"></span>
        </nav>
        <h1>
            ON108 YOGA
            <span style="display: block; font-size: 11px; font-weight: 200; letter-spacing: 0.2em; margin-top: 4px; color: #777;">
                온108요가
            </span>
        </h1>
    </header>
    
    <div class="admin-container">
        
        <!-- SECTION 1: 새롭게 신청된 최신 수강신청 표 -->
        <h2 class="section-title">✨ 최근 수강신청 건 (최신순)</h2>
        <div class="recent-table-box">
            <table class="recent-table">
                <thead>
                    <tr>
                        <th>신청일시</th>
                        <th>연락처 / 성함</th>
                        <th>선택 수강권</th>
                        <th>상태</th>
                    </tr>
                </thead>
                <tbody id="recentTbody">
                    <tr>
                        <td colspan="4" class="empty-msg">최신 신청 내역을 불러오는 중입니다...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="divider"></div>

        <!-- SECTION 2: 날짜별 수업 예약 현황 -->
        <h2 class="section-title">📋 일자별 수업 회원 명단</h2>
        
        <!-- 날짜 선택 영역 -->
        <div class="date-picker-box">
            <label for="searchDate"><strong>조회 날짜:</strong></label>
            <input type="date" id="searchDate">
            <button id="loadBtn" class="btn-search">조회</button>
        </div>

        <!-- 예약 현황 출력 영역 -->
        <div id="reservationContainer">
            <p class="empty-msg">날짜를 선택하고 조회 버튼을 눌러주세요.</p>
        </div>

    </div>

    <footer>
        ⓒ ON108YOGA - booking-list.html
    </footer>

    <!-- booking-list.js 연동 -->
    <script type="module" src="./booking-list.js"></script>
</body>
</html>
