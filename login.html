<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ON108 YOGA</title>
    
    <!-- 구글 폰트 및 프리텐다드 불러오기 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fcfcfc;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. Header & Navigation */
        .navbar {
            justify-content: center;
            display: flex;
            text-align: center;
            align-items: center;
            gap: 15px;
            background-color: #517e73;
            padding: 10px;
            font-size: 14px;     
        }

        .navbar a {         
            text-decoration: none !important;
            color: white;
            font-weight: 500;
            letter-spacing: 0.08em;
            padding: 2px 4px;       
            transition: opacity 0.2s ease;            
        }

        .navbar a:hover {
            opacity: 0.8;
            text-decoration: none !important;
        }

        h1 {
            background-color: #f4efe6;
            color: #3f4e43;           
            text-align: center;
            letter-spacing: 0.35em;
            margin: 0;
            padding: 12px 0;
            font-family: 'Cormorant Garamond', 'Noto Sans KR', serif;
            font-weight: 300;
            font-size: 20px;
            text-transform: uppercase;
        }

        /* 2. Main Content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(63, 78, 67, 0.08);
            border: 1px solid #eae6df;
        }

        .login-container h2 {
            font-size: 22px;
            font-weight: 600;
            color: #3f4e43;
            margin-bottom: 28px;
            text-align: center;
            letter-spacing: -0.02em;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            background-color: #fafafa;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            border-color: #517e73;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(81, 126, 115, 0.15);
        }

        /* Checkbox */
        .remember-box {
            display: flex;
            align-items: center;
            margin-top: 16px;
            margin-bottom: 24px;
            text-align: left;
        }

        .remember-box label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            user-select: none;
        }

        .remember-box input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #517e73;
            cursor: pointer;
        }

        /* Submit Button */
