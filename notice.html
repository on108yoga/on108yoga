<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - ON108 YOGA</title>
    <link rel="stylesheet" href="./su_hp.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #faf7f2; margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3f4e43; padding-bottom: 15px; margin-bottom: 20px; }
        .header-bar h2 { margin: 0; color: #3f4e43; }
        
        .btn-write { background-color: #517e73; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-write:hover { background-color: #3e5c4e; }

        /* 게시글 카드 리스트 */
        .notice-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 16px; background: #fff; display: flex; gap: 20px; align-items: center; }
        .notice-card img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; }
        .notice-info { flex: 1; }
        .notice-title { font-size: 18px; font-weight: bold; color: #2d4538; margin-bottom: 8px; }
        .notice-date { font-size: 12px; color: #9ca3af; margin-bottom: 10px; }
        .notice-content { font-size: 14px; color: #4b5563; line-height: 1.5; white-space: pre-line; }

        /* 모달 팝업 스타일 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; width: 90%; max-width: 500px; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-top: 0; color: #3f4e43; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .form-group textarea { height: 120px; resize: none; }
        
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #9ca3af; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-submit { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>📢 공지사항</h2>
        <button id="writeBtn" class="btn-write" style="display: none;">글쓰기</button>
    </div>

    <!-- 공지사항 리스트가 들어갈 영역 -->
    <div id="noticeList">
        <p style="text-align:center; color:#888;">공지사항을 불러오는 중...</p>
    </div>
</div>

<!-- 글쓰기 모달 창 -->
<div id="writeModal" class="modal">
    <div class="modal-content">
        <h3>새 공지사항 작성</h3>
        <div class="form-group">
            <label>제목</label>
            <input type="text" id="noticeTitle" placeholder="제목을 입력하세요">
        </div>
        <div class="form-group">
            <label>이미지 URL (선택사항)</label>
            <input type="text" id="noticeImageUrl" placeholder="https://example.com/image.jpg">
        </div>
        <div class="form-group">
            <label>내용</label>
            <textarea id="noticeContent" placeholder="내용을 입력하세요"></textarea>
        </div>
        <div class="modal-btns">
            <button id="cancelModalBtn" class="btn-cancel">취소</button>
            <button id="saveNoticeBtn" class="btn-submit">등록하기</button>
        </div>
    </div>
</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="notice.js"></script>
</body>
</html>
