<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 수강신청 게시판 - ON108 YOGA</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Pretendard', sans-serif; background-color: #fcfcfc; color: #333; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { justify-content: space-between; display: flex; align-items: center; background-color: #517e73; padding: 12px 20px; font-size: 14px; }
        .navbar-links a { color: #ffffff; text-decoration: none; font-weight: 500; padding: 4px 8px; }
        .role-toggle-btn { background-color: #3f4e43; color: #ffffff; border: 1px solid rgba(255,255,255,0.3); padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        h1 { background-color: #f4efe6; color: #3f4e43; text-align: center; margin: 0; padding: 16px 0; font-size: 22px; text-transform: uppercase; }
        main { flex: 1; max-width: 860px; width: 100%; margin: 30px auto; padding: 0 20px; }
        .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .role-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .role-badge.user { background-color: #e8f5e9; color: #2e7d32; }
        .role-badge.admin { background-color: #ffebee; color: #c62828; }
        .board-table-container { background: #ffffff; border-radius: 12px; border: 1px solid #eae6df; overflow: hidden; }
        .board-table { width: 100%; border-collapse: collapse; text-align: left; }
        .board-table th, .board-table td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
        .board-table th { background-color: #f4efe6; color: #3f4e43; font-weight: 600; }
        .post-title-link { color: #333; font-weight: 500; text-decoration: none; cursor: pointer; }
        .post-title-link:hover { color: #517e73; text-decoration: underline; }
        .status-tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-approved { background-color: #d4edda; color: #155724; }
        .detail-row { display: none; background-color: #fafafa; }
        .detail-row.active { display: table-row; }
        .detail-container { padding: 20px; border-left: 4px solid #517e73; }
        .detail-info { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        .detail-info th, .detail-info td { padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #eee; }
        .detail-info th { width: 25%; color: #666; background-color: #f5f5f5; }
        footer { padding: 20px; text-align: center; font-size: 12px; color: #999; background-color: #f4efe6; border-top: 1px solid #eae6df; margin-top: auto; }
    </style>
</head>
<body>

<header>
    <nav class="navbar">
        <div class="navbar-links">
            <a href="index.html">홈</a>
            <a href="event-login.html">로그인/수강신청</a>
        </div>
        <button class="role-toggle-btn" id="adminLoginBtn">🔑 관리자 로그인</button>
    </nav>
    <h1>ON108 YOGA<span style="display: block; font-size: 11px; color: #777;">수강 신청 게시판</span></h1>
</header>

<main>
    <div class="status-header">
        <h2 id="boardTitle">내 수강신청 목록</h2>
        <span id="roleBadge" class="role-badge user">🔒 일반 사용자</span>
    </div>

    <div class="board-table-container">
        <table class="board-table">
            <thead>
                <tr>
                    <th style="width: 10%;">번호</th>
                    <th style="width: 50%;">목록</th>
                    <th style="width: 20%;">신청자</th>
                    <th style="width: 20%;">상태</th>
                </tr>
            </thead>
            <tbody id="boardTbody">
                <tr><td colspan="4" style="text-align:center; padding:30px;">신청 내역을 불러오는 중입니다...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<footer><p>© ON108YOGA Reservation System</p></footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isAdmin = false;

    // 관리자 버튼 클릭 시 처리
    document.getElementById('adminLoginBtn').addEventListener('click', async () => {
        if (isAdmin) {
            await signOut(auth);
            alert("로그아웃 되었습니다.");
            location.reload();
        } else {
            const email = prompt("관리자 이메일을 입력하세요:");
            if (!email) return;
            const password = prompt("비밀번호를 입력하세요:");
            if (!password) return;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("관리자로 로그인되었습니다.");
            } catch (err) {
                alert("로그인 실패: " + err.message);
            }
        }
    });

    // 인증 상태 감지
    onAuthStateChanged(auth, async (user) => {
        const tbody = document.getElementById('boardTbody');
        const roleBadge = document.getElementById('roleBadge');
        const adminBtn = document.getElementById('adminLoginBtn');
        const boardTitle = document.getElementById('boardTitle');

        if (user) {
            // 이메일 또는 커스텀 클레임/UID 기반 관리자 판별 (필요시 관리자 이메일 주소 수정)
            if (user.email && user.email.includes("admin")) { 
                isAdmin = true;
                roleBadge.innerText = "🔓 관리자 모드";
                roleBadge.className = "role-badge admin";
                adminBtn.innerText = "🚪 로그아웃";
                boardTitle.innerText = "전체 회원 수강신청 목록 (관리자)";
                await loadAllReservations();
            } else {
                isAdmin = false;
                roleBadge.innerText = "🔒 일반 사용자";
                roleBadge.className = "role-badge user";
                boardTitle.innerText = "내 수강신청 목록";
                await loadUserReservations(user.uid);
            }
        } else {
            isAdmin = false;
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px;">로그인이 필요합니다. <a href="event-login.html">로그인하기</a></td></tr>`;
        }
    });

    // 1. 일반 회원용 내 신청내역만 조회
    async function loadUserReservations(uid) {
        const q = query(collection(db, "reservations"), where("userId", "==", uid));
        await renderTableData(q);
    }

    // 2. 관리자용 전체 신청내역 조회
    async function loadAllReservations() {
        const q = query(collection(db, "reservations"));
        await renderTableData(q);
    }

    async function renderTableData(q) {
        const tbody = document.getElementById('boardTbody');
        tbody.innerHTML = '';

        try {
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999; padding:30px;">신청 내역이 없습니다.</td></tr>`;
                return;
            }

            let index = querySnapshot.size;
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const docId = doc.id;
                const isApproved = data.status === 'approved';
                const statusClass = isApproved ? 'status-approved' : 'status-pending';
                const statusText = isApproved ? '승인' : '대기중';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index--}</td>
                    <td><span class="post-title-link" data-id="${docId}">🔒 [신청] ${data.ticketName || '수강신청'}</span></td>
                    <td>${data.userName || '신청자'}</td>
                    <td><span class="status-tag ${statusClass}">${statusText}</span></td>
                `;

                const detailTr = document.createElement('tr');
                detailTr.className = `detail-row`;
                detailTr.id = `detail-${docId}`;
                detailTr.innerHTML = `
                    <td colspan="4" style="padding: 0;">
                        <div class="detail-container">
                            <table class="detail-info">
                                <tr><th>신청 일자</th><td>${data.createdAt || '-'}</td></tr>
                                <tr><th>연락처</th><td>${data.phone || '-'}</td></tr>
                                <tr><th>수강권명</th><td style="color:#517e73; font-weight:bold;">${data.ticketName || '-'}</td></tr>
                            </table>
                        </div>
                    </td>
                `;

                tbody.appendChild(tr);
                tbody.appendChild(detailTr);

                tr.querySelector('.post-title-link').addEventListener('click', () => {
                    document.getElementById(`detail-${docId}`).classList.toggle('active');
                });
            });
        } catch (error) {
            console.error("데이터 조회 오류:", error);
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red; padding:30px;">권한이 없거나 불러오기에 실패했습니다. (Firestore 규칙 확인)</td></tr>`;
        }
    }
</script>
</body>
</html>
