<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 수강신청 게시판 - ON108 YOGA</title>
    
    <!-- 구글 폰트 및 프리텐다드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fcfcfc;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. Header & Navigation */
        .navbar {
            justify-content: space-between;
            display: flex;
            align-items: center;
            background-color: #517e73;
            padding: 10px 20px;
            font-size: 14px;      
        }

        .navbar-links a {          
            color: white;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 0.08em;
            padding: 2px 8px;
            transition: opacity 0.2s ease;            
        }

        .navbar-links a:hover {
            opacity: 0.8;
        }

        /* 권한 스위치 버튼 */
        .role-toggle-btn {
            background-color: #3f4e43;
            color: #fff;
            border: 1px solid #ffffff44;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .role-toggle-btn:hover {
            background-color: #2d3830;
        }

        h1 {
            background-color: #f4efe6;
            color: #3f4e43;
            text-align: center;
            letter-spacing: 0.35em;
            margin: 0;
            padding: 12px 0;
            font-family: 'Cormorant Garamond', 'Noto Sans KR', serif;
            font-weight: 300;
            font-size: 20px;
            text-transform: uppercase;
        }

        /* 2. Main Container */
        main {
            flex: 1;
            max-width: 860px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* 상태 요약 바 */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .status-header h2 {
            font-size: 18px;
            color: #3f4e43;
            margin: 0;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .role-badge.user {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .role-badge.admin {
            background-color: #ffebee;
            color: #c62828;
        }

        /* 3. 게시판 목록 테이블 스타일 */
        .board-table-container {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #eae6df;
            box-shadow: 0 4px 16px rgba(63, 78, 67, 0.04);
            overflow: hidden;
        }

        .board-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .board-table th, .board-table td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .board-table th {
            background-color: #f4efe6;
            color: #3f4e43;
            font-weight: 600;
        }

        .board-table tbody tr {
            transition: background-color 0.2s;
        }

        .board-table tbody tr:hover {
            background-color: #faf8f5;
        }

        /* 제목 클릭 연결 */
        .post-title-link {
            color: #333;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
        }

        .post-title-link:hover {
            color: #517e73;
            text-decoration: underline;
        }

        /* 비밀글 아이콘 */
        .lock-icon {
            font-size: 12px;
            margin-right: 4px;
        }

        /* 상태 태그 */
        .status-tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            display: inline-block;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background-color: #d4edda;
            color: #155724;
        }

        /* 관리자 삭제 버튼 */
        .btn-delete {
            background-color: #fff1f0;
            color: #e11d48;
            border: 1px solid #fca5a5;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: #e11d48;
            color: #ffffff;
        }

        /* 4. 상세보기 레이어 (아코디언 형태) */
        .detail-row {
            display: none;
            background-color: #fafafa;
        }

        .detail-row.active {
            display: table-row;
        }

        .detail-container {
            padding: 20px;
            border-left: 3px solid #517e73;
        }

        .detail-info {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }

        .detail-info th, .detail-info td {
            padding: 8px 12px;
            font-size: 13px;
            border-bottom: 1px solid #eee;
        }

        .detail-info th {
            width: 20%;
            color: #666;
            background-color: #f5f5f5;
        }

        /* 댓글 영역 */
        .comments-section {
            background: #ffffff;
            border: 1px solid #eae6df;
            border-radius: 8px;
            padding: 16px;
        }

        .comments-title {
            font-size: 13px;
            font-weight: 700;
            color: #3f4e43;
            margin-bottom: 10px;
        }

        .comment-item {
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        .comment-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        .comment-author {
            font-weight: 700;
            color: #517e73;
        }

        .comment-body {
            font-size: 13px;
            color: #444;
        }

        /* 관리자 댓글 작성 폼 */
        .admin-comment-form {
            margin-top: 12px;
        }

        .admin-comment-form textarea {
            width: 100%;
            height: 60px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
            resize: vertical;
            outline: none;
        }

        .btn-comment-submit {
            margin-top: 6px;
            padding: 6px 14px;
            background-color: #3f4e43;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            float: right;
        }

        .btn-comment-submit:hover {
            background-color: #2d3830;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        /* 페이지네이션 스타일 */
        .pagination-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
        }
        
        .page-btn {
            border: 1px solid #eae6df;
            background-color: #ffffff;
            color: #3f4e43;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .page-btn:hover {
            background-color: #f4efe6;
        }
        
        .page-btn.active {
            background-color: #517e73;
            color: #ffffff;
            border-color: #517e73;
            font-weight: bold;
        }

        /* Footer */
        footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
            background-color: #f4efe6;
            border-top: 1px solid #eae6df;
            margin-top: auto;
        }        
    </style>
</head>

<body>
<header>
    <nav class="navbar">
        <div class="navbar-links">
            <a href="index.html">홈</a>
            <a href="event-login.html">로그인/수강신청</a>
        </div>
        <button class="role-toggle-btn" onclick="toggleRole()">
            🔑 : <span id="roleText">비공개 게시판</span>
        </button>
    </nav>
    
    <h1>
        ON108 YOGA
        <span style="display: block; font-size: 11px; font-weight: 200; letter-spacing: 0.2em; margin-top: 4px; color: #777;">
            수강 신청 게시판
        </span>
    </h1>
</header>

<main>
    <div class="status-header">
        <h2>전체 신청 목록</h2>
        <span id="roleBadge" class="role-badge user">🔒</span>
    </div>

    <div class="board-table-container">
        <table class="board-table">
            <thead>
                <tr>
                    <th style="width: 12%;">번호</th>
                    <th style="width: 48%;">신청 수강권 (제목)</th>
                    <th style="width: 20%;">작성자</th>
                    <th style="width: 10%;">상태</th>
                    <th style="width: 10%; text-align: center;" id="adminColHeader">관리</th>
                </tr>
            </thead>
            <tbody id="boardTbody">
                <!-- 자바스크립트로 동적 목록 구성 -->
            </tbody>
        </table>
    </div>

    <!-- 페이지 수 페이지네이션 영역 -->
    <div id="pagination" class="pagination-container"></div>
</main>

<footer>
    <p>© ON108YOGA Reservation System</p>
</footer>

<script>
    // 1. 관리자 설정 및 기본 변수
    const ADMIN_PASSWORD = "0093";
    let isAdmin = false;
    const currentUserPhone = localStorage.getItem('userPhone') || '010-1234-5678';

    // 페이지네이션 상태
    let currentPage = 1;
    const itemsPerPage = 10;

    // 기본 샘플 데이터
    const defaultPosts = [
        {
            id: 2,
            phone: '010-1234-5678',
            ticket: '비공개 글 입니다',
            status: 'pending',
            comments: [
                {
                    id: 201,
                    author: "ON108 YOGA 관리자",
                    date: "2026-08-12",
                    text: "수강 신청이 접수되었습니다. 계좌 입금 확인 시 승인 완료 처리됩니다."
                }
            ]
        },
        {
            id: 1,
            phone: '010-9876-5432',
            ticket: '비공개 글 입니다',
            status: 'approved',
            comments: [
                {
                    id: 101,
                    author: "ON108 YOGA 관리자",
                    date: "2026-08-10",
                    text: "입금 확인되었습니다. 수강 승인 완료되었습니다."
                }
            ]
        }
    ];

    // 2. LocalStorage에서 저장된 데이터 가져오기
    let postsData = JSON.parse(localStorage.getItem('yogaPostsData')) || defaultPosts;

    // 방금 새로 신청한 내역이 있다면 맨 앞에 추가
    const newTicket = localStorage.getItem('selectedTicket');
    const newPhone = localStorage.getItem('userPhone');

    if (newTicket && newPhone) {
        const newPost = {
            id: Date.now(),
            phone: newPhone,
            ticket: newTicket,
            status: 'pending',
            comments: []
        };
        
        postsData.unshift(newPost);
        savePosts();
        localStorage.removeItem('selectedTicket'); 
    }

    // 초기화 함수
    window.onload = function() {
        renderBoard();
        updateRoleUI();
    };

    // 변경된 데이터를 LocalStorage에 저장하는 함수
    function savePosts() {
        localStorage.setItem('yogaPostsData', JSON.stringify(postsData));
    }

    // 게시판 목록 렌더링
    function renderBoard() {
        const tbody = document.getElementById('boardTbody');
        if (!tbody) return;

        tbody.innerHTML = '';

        if (postsData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#999; padding:30px;">등록된 게시글이 없습니다.</td></tr>`;
            renderPagination();
            return;
        }

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const paginatedPosts = postsData.slice(startIndex, endIndex);

        paginatedPosts.forEach((post, index) => {
            const isApproved = post.status === 'approved';
            const statusClass = isApproved ? 'status-approved' : 'status-pending';
            const statusText = isApproved ? '승인' : '대기중';

            const maskedPhone = post.phone && post.phone.length >= 11 
                ? post.phone.substring(0, 3) + "-****-" + post.phone.substring(7)
                : post.phone;

            const displayNum = postsData.length - (startIndex + index);

            // 목록 행
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${displayNum}</td>
                <td>
                    <span class="post-title-link" onclick="toggleDetail(${post.id})">
                        🔒 [수강신청] ${post.ticket}
                    </span>
                </td>
                <td>${maskedPhone}</td>
                <td><span class="status-tag ${statusClass}">${statusText}</span></td>
                <td style="text-align: center;">
                    ${isAdmin ? `<button class="btn-delete" onclick="deletePost(${post.id})">삭제</button>` : '-'}
                </td>
            `;

            // 상세 내용 행
            const detailTr = document.createElement('tr');
            detailTr.className = 'detail-row';
            detailTr.id = `detail-${post.id}`;

            let commentsHtml = '';
            if (!post.comments || post.comments.length === 0) {
                commentsHtml = '<p style="font-size:12px; color:#999;">등록된 답변이 없습니다.</p>';
            } else {
                post.comments.forEach(c => {
                    const commentDeleteBtn = isAdmin 
                        ? `<button class="btn-delete" style="font-size:10px;" onclick="deleteComment(${post.id}, ${c.id})">삭제</button>` 
                        : '';
                    commentsHtml += `
                        <div class="comment-item">
                            <div class="comment-header">
                                <span class="comment-author">${c.author}</span>
                                <div><span>${c.date}</span> ${commentDeleteBtn}</div>
                            </div>
                            <div class="comment-body">${c.text}</div>
                        </div>
                    `;
                });
            }

            detailTr.innerHTML = `
                <td colspan="5" style="padding: 0;">
                    <div class="detail-container">
                        <table class="detail-info">
                            <tr>
                                <th>신청자 전화번호</th>
                                <td>${post.phone}</td>
                            </tr>
                            <tr>
                                <th>선택 수강권</th>
                                <td style="color:#517e73; font-weight:bold;">${post.ticket}</td>
                            </tr>
                            <tr>
                                <th>입금 계좌</th>
                                <td>OO은행 123-456-789012 (예금주: 온108요가)</td>
                            </tr>
                        </table>

                        <div class="comments-section">
                            <div class="comments-title">💬 관리자 답변 및 승인 안내</div>
                            <div>${commentsHtml}</div>

                            ${isAdmin ? `
                                <div class="admin-comment-form clearfix">
                                    <textarea id="comment-input-${post.id}" placeholder="답변 입력 (단어 '승인' 또는 '확인' 작성 시 자동 승인 처리)"></textarea>
                                    <button class="btn-comment-submit" onclick="addAdminComment(${post.id})">답변 등록</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </td>
            `;

            tbody.appendChild(tr);
            tbody.appendChild(detailTr);
        });

        renderPagination();
    }

    // 상세 펼치기 / 열기
    function toggleDetail(postId) {
        const targetPost = postsData.find(p => p.id === postId);
        const isOwner = targetPost && (targetPost.phone === currentUserPhone);

        if (!isOwner && !isAdmin) {
            alert("비밀글 기능으로 작성자 본인만 확인하실 수 있습니다. 🌿");
            return;
        }

        const targetRow = document.getElementById(`detail-${postId}`);
        if (targetRow.classList.contains('active')) {
            targetRow.classList.remove('active');
        } else {
            document.querySelectorAll('.detail-row').forEach(row => row.classList.remove('active'));
            targetRow.classList.add('active');
        }
    }

    // 게시글 삭제
    function deletePost(postId) {
        if (!isAdmin) return;
        if (confirm("이 게시글을 삭제하시겠습니까?")) {
            postsData = postsData.filter(p => p.id !== postId);
            savePosts();
            renderBoard();
        }
    }

    // 댓글 삭제
    function deleteComment(postId, commentId) {
        if (!isAdmin) return;
        if (confirm("이 답변을 삭제하시겠습니까?")) {
            const targetPost = postsData.find(p => p.id === postId);
            if (targetPost) {
                targetPost.comments = targetPost.comments.filter(c => c.id !== commentId);
                savePosts();
                renderBoard();
                document.getElementById(`detail-${postId}`)?.classList.add('active');
            }
        }
    }

    // 관리자 답변 등록
    function addAdminComment(postId) {
        if (!isAdmin) return;
        const input = document.getElementById(`comment-input-${postId}`);
        const text = input ? input.value.trim() : '';

        if (!text) {
            alert('답변을 입력해 주세요.');
            return;
        }

        const targetPost = postsData.find(p => p.id === postId);
        if (targetPost) {
            const now = new Date();
            const dateStr = now.toISOString().slice(0, 10);

            targetPost.comments.push({
                id: Date.now(),
                author: "ON108 YOGA 관리자",
                date: dateStr,
                text: text
            });

            if (text.includes('확인') || text.includes('승인')) {
                targetPost.status = 'approved';
            }

            savePosts();
            renderBoard();
            document.getElementById(`detail-${postId}`)?.classList.add('active');
        }
    }

    // 권한 변경 스위치
    function toggleRole() {
        if (!isAdmin) {
            const password = prompt("관리자 비밀번호를 입력하세요.");
            
            if (password === null) return;
            
            if (password === ADMIN_PASSWORD) {
                isAdmin = true;
                alert("관리자 모드로 전환되었습니다.");
            } else {
                alert("비밀번호가 올바르지 않습니다.");
                return;
            }
        } else {
            isAdmin = false;
            alert("일반 회원 모드로 전환되었습니다.");
        }

        updateRoleUI();
        renderBoard();
    }

    // 권한 UI 업데이트
    function updateRoleUI() {
        const roleText = document.getElementById('roleText');
        const roleBadge = document.getElementById('roleBadge');

        if (roleText && roleBadge) {
            if (isAdmin) {
                roleText.innerText = '관리자';
                roleBadge.innerText = '관리자 모드';
                roleBadge.className = 'role-badge admin';
            } else {
                roleText.innerText = '비공개 게시판';
                roleBadge.innerText = '🔒';
                roleBadge.className = 'role-badge user';
            }
        }
    }

    // 페이지네이션 렌더링
    function renderPagination() {
        const paginationContainer = document.getElementById('pagination');
        if (!paginationContainer) return;

        paginationContainer.innerHTML = '';
        const totalPages = Math.ceil(postsData.length / itemsPerPage);

        if (totalPages <= 1) return;

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            btn.onclick = () => {
                currentPage = i;
                renderBoard();
            };
            paginationContainer.appendChild(btn);
        }
    }
</script>
</body>
</html>
