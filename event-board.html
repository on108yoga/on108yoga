<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 수강신청 게시판 - ON108 YOGA</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fcfcfc;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            justify-content: center;
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #517e73;
            padding: 10px;
            font-size: 14px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        h1 {
            background-color: #f4efe6;
            color: #3f4e43;
            text-align: center;
            letter-spacing: 0.35em;
            padding: 12px 0;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 20px;
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
        }

        .board-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(63, 78, 67, 0.06);
            border: 1px solid #eae6df;
            margin-bottom: 24px;
        }

        .board-title {
            font-size: 18px;
            color: #3f4e43;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #517e73;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 테이블 스타일 */
        .board-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        .board-table th {
            background-color: #f4efe6;
            color: #3f4e43;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid #e2d9cc;
            white-space: nowrap;
        }

        .board-table td {
            padding: 14px;
            border-bottom: 1px solid #f3f4f6;
            color: #4b5563;
        }

        .board-table tr:hover {
            background-color: #faf9f6;
        }

        /* 비밀글 제목 링크 */
        .post-title-link {
            color: #111827;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-title-link:hover {
            color: #517e73;
            text-decoration: underline;
        }

        /* 내용 확장(아코디언) 영역 스타일 */
        .detail-row {
            background-color: #f8fafc;
            display: none;
        }
        .detail-content {
            padding: 20px;
            font-size: 13px;
            color: #334155;
            line-height: 1.6;
            border-left: 3px solid #517e73;
            background: #f0f7f5;
            border-radius: 4px;
            margin: 8px 0;
        }

        /* 페이징 버튼 박스 */
        #paginationBox {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
        }

        .page-btn {
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            background-color: #ffffff;
            color: #334155;
        }

        .page-btn.active {
            background-color: #517e73;
            color: #ffffff;
            font-weight: bold;
            border-color: #517e73;
        }

        .empty-msg {
            text-align: center;
            color: #9ca3af;
            padding: 30px;
        }

        footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
            background-color: #f4efe6;
            margin-top: auto;
        }
    </style>
</head>
<body>

<header>
    <nav class="navbar">
        <a href="index.html">홈</a>
        <a href="reservation.html">수업예약</a>
        <a href="mypage.html">마이페이지</a>
    </nav>
    <h1>ON108 YOGA <span>온108요가</span></h1>
</header>

<main>
    <div class="board-card">
        <div class="board-title">
            <span> 수강신청 게시판</span>
            <span id="userBadge" style="font-size:12px; color:#666;">확인 중...</span>
        </div>
        
        <div style="overflow-x: auto;">
            <table class="board-table">
                <thead>
                    <tr>
                        <th style="width: 8%; text-align: center;">번호</th>
                        <th style="width: 52%;">제목</th>
                        <th style="width: 20%; text-align: center;">작성자(익명)</th>
                        <th style="width: 20%; text-align: center;">날짜</th>
                    </tr>
                </thead>
                <tbody id="boardTbody">
                    <tr>
                        <td colspan="4" class="empty-msg">신청 리스트를 불러오는 중입니다...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 10개 단위 숫자 스크롤 페이지네이션 -->
        <div id="paginationBox"></div>
    </div>
</main>

<footer>
    <p>© ON108 YOGA Reservation System</p>
</footer>

<script type="module" src="firebase.js"></script>
<script type="module" src="event-board.js"></script>
</body>
</html>
