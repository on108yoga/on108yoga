<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 예약 게시판 - ON108 YOGA</title>
    
    <!-- 구글 폰트 및 프리텐다드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fcfcfc;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. Header & Navigation */
        .navbar {
            justify-content: space-between;
            display: flex;
            align-items: center;
            background-color: #517e73;
            padding: 10px 20px;
            font-size: 14px;     
        }

        .navbar-links a {         
            color: white;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 0.08em;
            padding: 2px 8px;
            transition: opacity 0.2s ease;            
        }

        .navbar-links a:hover {
            opacity: 0.8;
        }

        /* 권한 스위치 버튼 */
        .role-toggle-btn {
            background-color: #3f4e43;
            color: #fff;
            border: 1px solid #ffffff44;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .role-toggle-btn:hover {
            background-color: #2d3830;
        }

        h1 {
            background-color: #f4efe6;
            color: #3f4e43;
            text-align: center;
            letter-spacing: 0.35em;
            margin: 0;
            padding: 12px 0;
            font-family: 'Cormorant Garamond', 'Noto Sans KR', serif;
            font-weight: 300;
            font-size: 20px;
            text-transform: uppercase;
        }

        /* 2. Main Container */
        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* 상단 회원 정보 상태 바 */
        .user-status-card {
            background-color: #ffffff;
            border: 1px solid #eae6df;
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 6px 16px rgba(63, 78, 67, 0.04);
        }

        .user-info p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        .user-info strong {
            color: #3f4e43;
            font-size: 16px;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .role-badge.user {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .role-badge.admin {
            background-color: #ffebee;
            color: #c62828;
        }

        /* 게시글 카드 목록 */
        .board-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #eae6df;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(63, 78, 67, 0.06);
            margin-bottom: 24px;
            position: relative;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 20px;
        }

        .board-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .board-header h2 {
            margin: 0;
            font-size: 18px;
            color: #3f4e43;
        }

        .status-tag {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background-color: #d4edda;
            color: #155724;
        }

        /* 삭제 버튼 전용 스타일 */
        .btn-delete {
            background-color: #fff1f0;
            color: #e11d48;
            border: 1px solid #fca5a5;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-delete:hover {
            background-color: #e11d48;
            color: #ffffff;
        }

        /* 읽기 전용 상세 테이블 */
        .detail-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
        }

        .detail-table th, .detail-table td {
            padding: 12px 14px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid #f9f9f9;
        }

        .detail-table th {
            width: 25%;
            color: #777;
            font-weight: 500;
            background-color: #fafafa;
        }

        .detail-table td {
            color: #333;
            font-weight: 500;
        }

        /* 댓글/답변 영역 */
        .comments-section {
            background-color: #fcfcfc;
            border: 1px solid #f0eee8;
            border-radius: 12px;
            padding: 20px;
        }

        .comments-title {
            font-size: 14px;
            font-weight: 700;
            color: #3f4e43;
            margin-bottom: 14px;
        }

        .comment-item {
            background: #ffffff;
            border: 1px solid #eae6df;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        .comment-author {
            font-weight: 700;
            color: #517e73;
        }

        .comment-body {
            font-size: 14px;
            color: #444;
            line-height: 1.5;
            white-space: pre-line;
        }

        /* 관리자 전용 댓글 작성 폼 */
        .admin-comment-form {
            margin-top: 16px;
        }

        .admin-comment-form textarea {
            width: 100%;
            height: 80px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            resize: vertical;
            outline: none;
            font-family: inherit;
        }

        .admin-comment-form textarea:focus {
            border-color: #517e73;
            box-shadow: 0 0 0 2px rgba(81, 126, 115, 0.15);
        }

        .btn-comment-submit {
            margin-top: 8px;
            padding: 10px 18px;
            background-color: #3f4e43;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            float: right;
            transition: background 0.2s;
        }

        .btn-comment-submit:hover {
            background-color: #2d3830;
        }

        /* 일반 사용자용 안내 문구 */
        .user-readonly-notice {
            text-align: center;
            padding: 12px;
            background-color: #f4efe6;
            color: #777;
            font-size: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        /* 게시글이 없을 때 표시 */
        .empty-board {
            text-align: center;
            padding: 50px 20px;
            color: #999;
            background: #fff;
            border-radius: 16px;
            border: 1px dashed #e0e0e0;
        }

        /* Footer */
        footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
            background-color: #f4efe6;
            border-top: 1px solid #eae6df;
            margin-top: auto;
        }
    </style>
</head>

<body>
<header>
    <nav class="navbar">
        <div class="navbar-links">
            <a href="index.html">홈</a>
            <a href="event-login.html">로그인/수강신청</a>
        </div>
        <!-- 권한 전환 버튼 -->
        <button class="role-toggle-btn" onclick="toggleRole()">
            🔑 현재 모드: <span id="roleText">일반 회원</span> (클릭하여 전환)
        </button>
    </nav>
    
    <h1>
        ON108 YOGA
        <span style="display: block; font-size: 11px; font-weight: 200; letter-spacing: 0.2em; margin-top: 4px; color: #777;">
            비공개 예약 게시판
        </span>
    </h1>
</header>

<main>
    <!-- 상단 회원 상태 카드 -->
    <div class="user-status-card">
        <div class="user-info">
            <p>안녕하세요, <strong id="displayPhone">010-0000-0000</strong>님</p>
            <p style="font-size: 12px; margin-top: 4px;">수강 신청 내역 및 답변을 확인하는 전용 공간입니다.</p>
        </div>
        <span id="roleBadge" class="role-badge user">일반 작성자</span>
    </div>

    <!-- 게시글 목록이 들어가는 영역 -->
    <div id="postsContainer">
        <!-- 자바스크립트로 게시글 카드 동적 생성 -->
    </div>
</main>

<footer>
    <p>© ON108YOGA Reservation System</p>
</footer>

<script>
    // 현재 권한 상태 (false: 일반 회원 / true: 관리자)
    let isAdmin = false;

    // 샘플 게시글 데이터 구조
    let postsData = [
        {
            id: 1,
            phone: localStorage.getItem('userPhone') || '010-1234-5678',
            ticket: localStorage.getItem('selectedTicket') || '14+1회 (총 15회)',
            date: new Date().toISOString().slice(0, 10) + ' ' + new Date().toTimeString().slice(0, 5),
            status: 'pending', // 'pending' | 'approved'
            comments: [
                {
                    id: 101,
                    author: "ON108 YOGA 관리자",
                    date: "2026-08-12 15:30",
                    text: "수강 신청이 정상 접수되었습니다. 안내해 드린 계좌로 입금 확인 시 승인 완료로 변경됩니다."
                }
            ]
        }
    ];

    window.onload = function() {
        const savedPhone = localStorage.getItem('userPhone') || '010-1234-5678';
        document.getElementById('displayPhone').innerText = savedPhone;
        renderPosts();
        updateRoleUI();
    };

    // 전체 게시글 카드 렌더링
    function renderPosts() {
        const container = document.getElementById('postsContainer');
        container.innerHTML = '';

        if (postsData.length === 0) {
            container.innerHTML = `
                <div class="empty-board">
                    <p style="font-size: 15px; font-weight: 500;">등록되거나 남은 신청 내역이 없습니다.</p>
                    <a href="event-login.html" style="color: #517e73; font-size: 13px;">새로 수강 신청하러 가기</a>
                </div>
            `;
            return;
        }

        postsData.forEach(post => {
            const card = document.createElement('div');
            card.className = 'board-card';
            card.id = `post-${post.id}`;

            const isApproved = post.status === 'approved';
            const statusClass = isApproved ? 'status-approved' : 'status-pending';
            const statusText = isApproved ? '수강 승인 완료' : '입금 확인 대기중';

            // 관리자 전용 글 삭제 버튼
            const postDeleteBtnHtml = isAdmin 
                ? `<button class="btn-delete" onclick="deletePost(${post.id})">글 삭제</button>` 
                : '';

            // 댓글 목록 HTML 생성
            let commentsHtml = '';
            if (post.comments.length === 0) {
                commentsHtml = '<p style="font-size:13px; color:#999; text-align:center;">등록된 답변이 없습니다.</p>';
            } else {
                post.comments.forEach(c => {
                    // 관리자 전용 댓글 삭제 버튼
                    const commentDeleteBtnHtml = isAdmin 
                        ? `<button class="btn-delete" style="font-size:11px; padding:2px 6px;" onclick="deleteComment(${post.id}, ${c.id})">삭제</button>` 
                        : '';

                    commentsHtml += `
                        <div class="comment-item">
                            <div class="comment-header">
                                <span class="comment-author">${c.author}</span>
                                <div>
                                    <span style="margin-right: 8px;">${c.date}</span>
                                    ${commentDeleteBtnHtml}
                                </div>
                            </div>
                            <div class="comment-body">${c.text}</div>
                        </div>
                    `;
                });
            }

            card.innerHTML = `
                <div class="board-header">
                    <div class="board-header-left">
                        <h2>수강 신청 상세 내역</h2>
                        <span class="status-tag ${statusClass}" id="status-tag-${post.id}">${statusText}</span>
                    </div>
                    ${postDeleteBtnHtml}
                </div>

                <table class="detail-table">
                    <tr>
                        <th>연락처</th>
                        <td>${post.phone}</td>
                    </tr>
                    <tr>
                        <th>선택 수강권</th>
                        <td style="color: #517e73; font-weight: 700;">${post.ticket}</td>
                    </tr>
                    <tr>
                        <th>입금 안내 계좌</th>
                        <td>OO은행 123-456-789012 (예금주: 온108요가)</td>
                    </tr>
                    <tr>
                        <th>신청 일시</th>
                        <td>${post.date}</td>
                    </tr>
                </table>

                <div class="comments-section">
                    <div class="comments-title">💬 관리자 답변 및 안내</div>
                    <div id="comment-list-${post.id}">${commentsHtml}</div>

                    <!-- 관리자 모드 전용 댓글 작성 -->
                    <div class="admin-comment-form clearfix" style="display: ${isAdmin ? 'block' : 'none'};">
                        <textarea id="comment-input-${post.id}" placeholder="관리자 전용: 답변 등록 시 '확인' 또는 '승인' 단어가 포함되면 자동 승인 완료 처리됩니다."></textarea>
                        <button class="btn-comment-submit" onclick="addAdminComment(${post.id})">답변 등록</button>
                    </div>

                    <!-- 일반 회원 안내 문구 -->
                    <div class="user-readonly-notice" style="display: ${isAdmin ? 'none' : 'block'};">
                        🔒 답변 작성 및 글 삭제 권한은 관리자에게 있습니다.
                    </div>
                </div>
            `;

            container.appendChild(card);
        });
    }

    /* --- 삭제 기능 (관리자 전용) --- */

    // 1. 게시글 삭제
    function deletePost(postId) {
        if (!isAdmin) return;
        
        if (confirm("정말로 이 수강 신청 내역을 삭제하시겠습니까?\n삭제된 데이터는 복구되지 않습니다.")) {
            postsData = postsData.filter(p => p.id !== postId);
            renderPosts();
            alert("게시글이 삭제되었습니다.");
        }
    }

    // 2. 개별 댓글/답변 삭제
    function deleteComment(postId, commentId) {
        if (!isAdmin) return;

        if (confirm("이 관리자 답변을 삭제하시겠습니까?")) {
            const targetPost = postsData.find(p => p.id === postId);
            if (targetPost) {
                targetPost.comments = targetPost.comments.filter(c => c.id !== commentId);
                renderPosts();
            }
        }
    }

    /* --- 관리자 답변 등록 --- */
    function addAdminComment(postId) {
        if (!isAdmin) return;

        const input = document.getElementById(`comment-input-${postId}`);
        const text = input.value.trim();

        if (!text) {
            alert('답변 내용을 입력해 주세요.');
            return;
        }

        const targetPost = postsData.find(p => p.id === postId);
        if (targetPost) {
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            targetPost.comments.push({
                id: Date.now(),
                author: "ON108 YOGA 관리자",
                date: dateStr,
                text: text
            });

            // 승인/확인 키워드 포함 시 상태 자동 변경
            if (text.includes('확인') || text.includes('승인')) {
                targetPost.status = 'approved';
            }

            renderPosts();
        }
    }

    /* --- 권한 스위칭 및 UI 업데이트 --- */
    function toggleRole() {
        isAdmin = !isAdmin;
        updateRoleUI();
        renderPosts(); // 삭제 버튼 표시 상태 업데이트를 위해 다시 렌더링
    }

    function updateRoleUI() {
        const roleText = document.getElementById('roleText');
        const roleBadge = document.getElementById('roleBadge');

        if (isAdmin) {
            roleText.innerText = '관리자';
            roleBadge.innerText = '관리자 모드';
            roleBadge.className = 'role-badge admin';
        } else {
            roleText.innerText = '일반 회원';
            roleBadge.innerText = '일반 작성자';
            roleBadge.className = 'role-badge user';
        }
    }
</script>
</body>
</html>
