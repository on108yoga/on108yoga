<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익명 수강신청 게시판 - ON108 YOGA</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fcfcfc;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            justify-content: center;
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: #517e73;
            padding: 10px;
            font-size: 14px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        h1 {
            background-color: #f4efe6;
            color: #3f4e43;
            text-align: center;
            letter-spacing: 0.35em;
            padding: 12px 0;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 20px;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
        }

        .board-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(63, 78, 67, 0.06);
            border: 1px solid #eae6df;
            margin-bottom: 24px;
        }

        .board-title {
            font-size: 18px;
            color: #3f4e43;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #517e73;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 게시글 목록 스타일 */
        .post-item {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 16px;
            background: #fafafa;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .post-badge {
            background: #fee2e2;
            color: #dc2626;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .post-ticket-info {
            font-weight: bold;
            color: #2563eb;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .post-content {
            font-size: 14px;
            color: #374151;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* 댓글 영역 */
        .comment-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed #d1d5db;
        }

        .comment-item {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comment-author {
            font-weight: bold;
            color: #517e73;
            margin-right: 6px;
        }

        .btn-comment-del {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 12px;
            cursor: pointer;
            margin-left: 8px;
        }

        .comment-form {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .comment-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
        }

        .btn-comment-add {
            background: #517e73;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
            background-color: #f4efe6;
            margin-top: auto;
        }
    </style>
</head>
<body>

<header>
    <nav class="navbar">
        <a href="index.html">홈</a>
        <a href="reservation.html">수업예약</a>
        <a href="mypage.html">마이페이지</a>
    </nav>
    <h1>ON108 YOGA <span>온108요가</span></h1>
</header>

<main>
    <div class="board-card">
        <div class="board-title">
            <span>🔒 익명 수강신청/문의 내역</span>
            <span id="userBadge" style="font-size:12px; color:#666;"></span>
        </div>
        
        <div id="postsContainer">
            <p style="text-align:center; color:#999; padding:20px;">기존 신청 리스트를 불러오는 중입니다...</p>
        </div>
    </div>
</main>

<footer>
    <p>© ON108 YOGA Reservation System</p>
</footer>

<script type="module" src="firebase.js"></script>
<script type="module" src="event-board.js"></script>
</body>
</html>
